name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++

    - name: Configure CMake (Debug with Coverage)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_TESTS=ON \
          -DENABLE_COVERAGE=ON

    - name: Build
      run: cmake --build build --config Debug -j $(nproc)

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --verbose

  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++

    - name: Configure CMake (Release)
      run: |
        cmake -B build-release \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=OFF

    - name: Build Release
      run: cmake --build build-release --config Release -j $(nproc)

    - name: Package Header
      run: |
        mkdir -p artifacts
        cp src/TypeSQlite.hpp artifacts/
        if [ -f scripts/single_header.hpp ]; then
          cp scripts/single_header.hpp artifacts/
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-headers
        path: artifacts/
        retention-days: 90

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy cppcheck

    - name: Run cppcheck
      continue-on-error: true
      run: |
        cppcheck --enable=all --inconclusive --std=c++20 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          -I src/ \
          src/ 2>&1 | tee cppcheck-report.txt

    - name: Upload Code Quality Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-report
        path: cppcheck-report.txt
        retention-days: 30

