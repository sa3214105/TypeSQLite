name: Release - Build Single Header

on:
  push:
    tags:
      - 'v*'  # Matches version tags like v1.0.0, v2.1.3

permissions:
  contents: write  # 必須：允許創建 Release 和上傳文件 (Required: Allow creating releases and uploading files)

jobs:
  build-single-header:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install quom
      run: |
        pip install quom
        quom --version

    - name: Display toolchain versions
      run: |
        echo "=== Toolchain Versions ==="
        python3 --version
        quom --version

    - name: Generate single header file
      run: |
        mkdir -p release
        
        # 使用 quom 合併頭文件 (Use quom to merge header files)
        quom src/TypeSQlite.hpp release/TypeSQLite.hpp \
          --include_guard TYPESQLITE_SINGLE_HEADER_HPP \
          --trim
        
        # 驗證生成的文件 (Verify generated file)
        if [ -f release/TypeSQLite.hpp ]; then
          echo "✅ Single header file generated successfully"
          echo "📊 File statistics:"
          wc -l release/TypeSQLite.hpp
          du -h release/TypeSQLite.hpp
        else
          echo "❌ Failed to generate single header file"
          exit 1
        fi

    - name: Verify compilation
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libsqlite3-dev
        
        # 測試編譯生成的頭文件 (Test compile the generated header)
        echo '#include "release/TypeSQLite.hpp"' > test_compile.cpp
        echo 'int main() { return 0; }' >> test_compile.cpp
        
        g++ -std=c++20 -c test_compile.cpp -I. -o /dev/null
        
        if [ $? -eq 0 ]; then
          echo "✅ Header file compiles successfully"
        else
          echo "⚠️ Warning: Header file has compilation issues"
        fi

    - name: Create release info
      run: |
        echo "# TypeSQLite Single Header Release" > release/README.md
        echo "" >> release/README.md
        echo "**Version**: ${GITHUB_REF#refs/tags/}" >> release/README.md
        echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> release/README.md
        echo "**Commit**: ${GITHUB_SHA}" >> release/README.md
        echo "" >> release/README.md
        echo "## 使用方法 (Usage)" >> release/README.md
        echo "" >> release/README.md
        echo "\`\`\`cpp" >> release/README.md
        echo "#include \"TypeSQLite.hpp\"" >> release/README.md
        echo "" >> release/README.md
        echo "using namespace TypeSQLite;" >> release/README.md
        echo "" >> release/README.md
        echo "// Your code here" >> release/README.md
        echo "\`\`\`" >> release/README.md
        echo "" >> release/README.md
        echo "## 依賴項 (Dependencies)" >> release/README.md
        echo "" >> release/README.md
        echo "- C++20 或更高版本 (C++20 or later)" >> release/README.md
        echo "- SQLite3 library" >> release/README.md
        echo "" >> release/README.md
        echo "## 檔案統計 (File Statistics)" >> release/README.md
        echo "- **Lines**: $(wc -l < release/TypeSQLite.hpp)" >> release/README.md
        echo "- **Size**: $(du -h release/TypeSQLite.hpp | cut -f1)" >> release/README.md

    - name: Generate checksum
      run: |
        cd release
        sha256sum TypeSQLite.hpp > TypeSQLite.hpp.sha256
        echo "📝 SHA256 checksum:"
        cat TypeSQLite.hpp.sha256

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: |
          ## TypeSQLite Release ${{ github.ref_name }}
          
          ### 📦 單一頭文件函式庫 (Single Header Library)
          
          A single-header, header-only C++ library for type-safe SQLite operations.
          
          一個單頭文件、僅頭文件的 C++ 函式庫，提供型別安全的 SQLite 操作。
          
          ### 📥 下載與使用 (Download & Usage)
          
          1. Download `TypeSQLite.hpp`
          2. Include it in your project:
          
          ```cpp
          #include "TypeSQLite.hpp"
          
          using namespace TypeSQLite;
          
          // Your code here
          ```
          
          ### ✨ 特性 (Features)
          - 🔒 Type-safe SQL operations (型別安全的 SQL 操作)
          - 📄 Header-only library (僅頭文件函式庫)
          - 🚀 Modern C++20 design (現代 C++20 設計)
          - 🔧 No external dependencies except SQLite3 (除了 SQLite3 外無其他外部依賴)
          
          ### 📊 檔案資訊 (File Information)
          - **SHA256**: See `TypeSQLite.hpp.sha256`
          
          ### 🔧 編譯需求 (Build Requirements)
          - C++20 compiler (GCC 10+, Clang 10+, MSVC 2019+)
          - SQLite3 library
          
          ### 📝 變更日誌 (Changelog)
          
          See commit history for details. (詳見提交歷史)
        files: |
          release/TypeSQLite.hpp
          release/TypeSQLite.hpp.sha256
          release/README.md
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Summary
      run: |
        echo "🎉 Release ${{ github.ref_name }} created successfully!"
        echo "📦 Single header file published"
        echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        echo ""
        echo "📊 Release contents:"
        echo "  - TypeSQLite.hpp ($(du -h release/TypeSQLite.hpp | cut -f1))"
        echo "  - TypeSQLite.hpp.sha256"
        echo "  - README.md"

